<style>

</style></head><body>
<h1>🃏 Salón de Cartas</h1>
<div id="app"></div><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// Pegá acá la configuración de Firebase (solo hace falta para el modo online)
const FIREBASE_CONFIG={apiKey:"PEGA_AQUI",authDomain:"PEGA_AQUI",projectId:"PEGA_AQUI",appId:"PEGA_AQUI"};
const $=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const NUMS=[1,2,3,4,5,6,7,10,11,12],CN={10:"Sota",11:"Caballo",12:"Rey"},rk=n=>CN[n]||n;
const SU=[["Oros","🟡","#b8860b"],["Copas","🏆","#c0392b"],["Espadas","🗡️","#1f4e9c"],["Bastos","🌿","#2e7d32"]];
const deck40=()=>{const d=[];for(let s=0;s<4;s++)NUMS.forEach(n=>d.push(s+"."+n));return d};
const pc=c=>c.split(".").map(Number);
const nm=(g,id)=>(g.players.find(p=>p.id===id)||{}).name||"?";
const lg=(g,t)=>{g.log=(g.log||[]).concat(t).slice(-5)};
const COL=SU.map(x=>x[2]);
function suitSvg(s,x,y,z){const t=`translate(${x} ${y}) scale(${z})`;
  if(s===0)return `<g transform="${t}"><circle r="11" fill="#f4c542" stroke="#9a6b00" stroke-width="1.6"/><circle r="6.5" fill="none" stroke="#9a6b00" stroke-width="1.2"/><circle r="2.2" fill="#9a6b00"/></g>`;
  if(s===1)return `<g transform="${t}"><path d="M-9,-10H9C9,0 5,6 0,6C-5,6-9,0-9,-10Z" fill="#d94a4a" stroke="#7a1d1d" stroke-width="1.5"/><rect x="-1.6" y="5" width="3.2" height="6" fill="#7a1d1d"/><ellipse cx="0" cy="12" rx="6.5" ry="2" fill="#7a1d1d"/></g>`;
  if(s===2)return `<g transform="${t}"><path d="M0,-13L3.6,-9V6H-3.6V-9Z" fill="#cfd8e6" stroke="#2d4a85" stroke-width="1.4"/><rect x="-8" y="6" width="16" height="3" rx="1.2" fill="#2d4a85"/><rect x="-1.8" y="9" width="3.6" height="5" fill="#6b4a2b"/><circle cx="0" cy="15" r="2" fill="#2d4a85"/></g>`;
  return `<g transform="${t} rotate(25)"><rect x="-3.6" y="-13" width="7.2" height="26" rx="3.6" fill="#8a5a2b" stroke="#4a2f12" stroke-width="1.4"/><circle cx="0" cy="-5" r="1.6" fill="#4a2f12"/><circle cx="0" cy="4" r="1.6" fill="#4a2f12"/><path d="M3.6,-9q6,-2 7,4q-5,0 -7,-4z" fill="#3b8a3b"/></g>`}
const PIPS={1:[[30,45]],2:[[30,25],[30,65]],3:[[30,22],[30,45],[30,68]],4:[[19,26],[41,26],[19,64],[41,64]],5:[[19,26],[41,26],[30,45],[19,64],[41,64]],6:[[19,24],[41,24],[19,45],[41,45],[19,66],[41,66]],7:[[19,24],[41,24],[30,34],[19,45],[41,45],[19,66],[41,66]]};
const FIG={10:["♟","SOTA"],11:["♞","CABALLO"],12:["♚","REY"]},FC={};
function face(c){if(FC[c])return FC[c];const[s,n]=pc(c),col=COL[s];let g="";
  if(n<=7){const z=n===1?1.9:n<=3?.95:.72;g=PIPS[n].map(([x,y])=>suitSvg(s,x,y,z)).join("")}
  else g=`<rect x="11" y="24" width="38" height="44" rx="4" fill="${col}" fill-opacity=".12" stroke="${col}" stroke-width="1.4"/><text x="30" y="52" font-size="26" text-anchor="middle" fill="${col}" font-family="serif">${FIG[n][0]}</text><text x="30" y="62" font-size="5.5" font-weight="700" text-anchor="middle" fill="${col}" font-family="system-ui,sans-serif">${FIG[n][1]}</text>`+suitSvg(s,30,33,.45);
  const cr=`<text x="6" y="15" font-size="12" font-weight="700" fill="${col}" font-family="system-ui,sans-serif">${n}</text>`+suitSvg(s,10,24,.38);
  return FC[c]=`<svg viewBox="0 0 60 90"><rect x=".75" y=".75" width="58.5" height="88.5" rx="6" fill="#fffdf3" stroke="#6d6247" stroke-width="1.2"/>${cr}<g transform="rotate(180 30 45)">${cr}</g>${g}</svg>`}
const BACKSVG=`<svg viewBox="0 0 60 90"><rect x=".75" y=".75" width="58.5" height="88.5" rx="6" fill="#0a7d3c" stroke="#fff" stroke-width="2"/><rect x="5" y="5" width="50" height="80" rx="3" fill="none" stroke="#9be3b6" stroke-width="1"/><g stroke="#9be3b6" stroke-width=".8" opacity=".7">${Array.from({length:9},(_,i)=>`<path d="M${5+i*6},5L5,${5+i*6}M55,${85-i*6}L${55-i*6},85"/>`).join("")}</g><circle cx="30" cy="45" r="11" fill="#f4c542" stroke="#9a6b00" stroke-width="1.4"/><circle cx="30" cy="45" r="6" fill="none" stroke="#9a6b00"/></svg>`;
function card(c,cls,a,st){return `<div class="cd ${cls||""}" data-id="${c}" ${a?`data-a="${a}" data-p="${esc(JSON.stringify(c))}"`:""} ${st?`style="${st}"`:""}>${face(c)}</div>`}
const back=()=>`<div class="cd back">${BACKSVG}</div>`;
const backFan=n=>`<span class="bf">${Array.from({length:Math.min(n,12)},(_,i)=>`<i style="margin-left:${i?-8:0}px"></i>`).join("")}<small class="mut" style="margin-left:6px">${n}</small></span>`;
const stack=n=>`<div id="pile" class="stack">${n?Array.from({length:Math.min(5,Math.ceil(n/3))},(_,i)=>`<div class="cd back" style="left:${6+i*6}px;top:${14-i*3}px;transform:rotate(${(i-1)*5}deg)">${BACKSVG}</div>`).join(""):""}</div>`;
let ORD={},busy=false,animKey=-1,DR=null,dragged=false;
const dsort=(a,b)=>pc(a)[0]-pc(b)[0]||NUMS.indexOf(pc(a)[1])-NUMS.indexOf(pc(b)[1]);
function hand(cs,owner){const o=ORD[owner]||[],known=o.filter(c=>cs.includes(c)),rest=cs.filter(c=>!known.includes(c));if(!known.length)rest.sort(dsort);const out=known.concat(rest);ORD[owner]=out;return out}
function fan(cs,o){o=o||{};const n=cs.length,step=n<2?0:Math.min(8,40/(n-1)),ml=n<=3?-6:n<=5?-18:n<=7?-27:-33,sel=(o.sel||[]).filter(Boolean);
  return `<div class="fan" data-owner="${esc(o.owner||"")}">`+cs.map((c,i)=>{const d=i-(n-1)/2;return card(c,sel.includes(c)?"sel":"",o.act||"",`z-index:${i};--r:${(d*step).toFixed(1)}deg;--y:${Math.round(d*d*1.1)}px;--ml:${ml}px`)}).join("")+`</div>`}
document.addEventListener("pointerdown",e=>{const c=e.target.closest&&e.target.closest(".fan .cd");if(!c||(e.button||0)>0)return;DR={c,x:e.clientX,id:e.pointerId,on:false}});
document.addEventListener("pointermove",e=>{if(!DR)return;const dx=e.clientX-DR.x;if(!DR.on){if(Math.abs(dx)<10)return;DR.on=true;DR.c.classList.add("drag");try{DR.c.setPointerCapture(DR.id)}catch(_){}}
  DR.c.style.transform=`translate(${dx}px,-8px) rotate(0deg)`;if(e.cancelable)e.preventDefault()});
const endDrag=e=>{if(!DR)return;const d=DR;DR=null;if(!d.on)return;dragged=true;setTimeout(()=>dragged=false,150);
  const fn=d.c.parentElement,cs=[...fn.children].filter(x=>x!==d.c);let idx=0;cs.forEach(x=>{const r=x.getBoundingClientRect();if(r.left+r.width/2<e.clientX)idx++});
  const ids=cs.map(x=>x.dataset.id);ids.splice(idx,0,d.c.dataset.id);ORD[fn.dataset.owner]=ids;render()};
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);
const cardEl=id=>[...document.querySelectorAll(".cd[data-id]")].find(e=>e.dataset.id===id);
const PE=(el,k)=>{const r=el.getBoundingClientRect();return{cx:r.left+r.width/2,cy:r.top+r.height/2,s:(el.offsetWidth||58)/58,k}};
function flight(c,pts,ms,cb){const e=document.createElement("div");if(!e.animate){if(cb)cb();return}
  e.style.cssText="position:fixed;left:0;top:0;z-index:50;pointer-events:none;transform-origin:0 0";e.innerHTML=card(c);document.body.appendChild(e);
  const an=e.animate(pts.map(p=>({transform:`translate(${p.cx-29*p.s}px,${p.cy-43.5*p.s}px) scale(${p.s})`,offset:p.k})),{duration:ms,easing:"ease-in-out",fill:"forwards"});
  an.onfinish=an.oncancel=()=>{e.remove();if(cb)cb()}}
const actorId=()=>R.mode==="local"?GAMES[R.game].turnOf(R.S):me;
function fxFor(a,p){const g=R.game,id=actorId();let pr=[];
  if(g==="chinchon"&&(a==="discard"||a==="cut"))pr=[[p,"#discpile"]];
  else if(g==="escoba"&&a==="play"){pr=[[p.c,p.t.length?"#sc-"+id:"#tbl"]].concat(p.t.map(x=>[x,"#sc-"+id]))}
  else if(g==="mentiroso"&&a==="play")pr=p.map(x=>[x,"#pile"]);
  else if(g==="truco"&&a==="play")pr=[[p,"#tbl"]];
  pr=pr.map(([c,t])=>[cardEl(c),$(t)]).filter(x=>x[0]&&x[1]);if(!pr.length)return null;
  return cb=>{let left=pr.length;pr.forEach(([el,T],i)=>{const a0=PE(el,0),r=T.getBoundingClientRect();el.style.visibility="hidden";
    flight(el.dataset.id,[a0,{cx:r.left+r.width/2+i*8,cy:r.top+r.height/2,s:a0.s*.9,k:1}],650+i*70,()=>{if(--left===0)cb()})})}}
function go(a,p){const G=GAMES[R.game],S=R.mode==="online"?R.room.S:R.S,g2=clone(S),e=G.act(g2,actorId(),a,p);if(e){toast(e);return}
  const f=fxFor(a,p);if(!f)return dispatch(a,p);busy=true;f(()=>{busy=false;dispatch(a,p)})}

/* ================= ESCOBA ================= */
const ev=c=>{const n=pc(c)[1];return n<=7?n:n-2};
const PV={7:21,6:18,1:16,5:15,4:14,3:13,2:12,10:10,11:10,12:10};
const prim=cs=>{let t=0;for(let s=0;s<4;s++){const v=cs.filter(c=>pc(c)[0]===s).map(c=>PV[pc(c)[1]]);if(!v.length)return 0;t+=Math.max(...v)}return t};
function combos(tb,t){const out=[],go=(i,acc,sum)=>{if(sum===t&&acc.length){out.push(acc.slice());return}if(sum>=t)return;for(let k=i;k<tb.length;k++){acc.push(tb[k]);go(k+1,acc,sum+ev(tb[k]));acc.pop()}};go(0,[],0);return out}
const deal=g=>g.players.forEach(p=>g.hands[p.id]=g.deck.splice(0,3));
function esRound(g){let tb,dk;do{dk=shuffle(deck40());tb=dk.splice(0,4)}while(tb.filter(c=>pc(c)[1]===12).length>=3);
  g.deck=dk;g.table=tb;g.round++;g.dealer=(g.dealer+1)%g.players.length;g.turn=(g.dealer+1)%g.players.length;g.last=null;
  g.players.forEach(p=>{g.caps[p.id]=[];g.esc[p.id]=0});deal(g)}
function endRound(g){
  if(g.last)g.caps[g.last].push(...g.table);g.table=[];
  const P=g.players,pt={},L=[];P.forEach(p=>pt[p.id]=0);
  const best=(f,t)=>{const v=P.map(p=>f(g.caps[p.id])),m=Math.max(...v);if(m>0&&v.filter(x=>x===m).length===1){const w=P[v.indexOf(m)];pt[w.id]++;L.push(t+": "+w.name)}else L.push(t+": nadie (empate)")};
  best(c=>c.length,"Más cartas");best(c=>c.filter(x=>pc(x)[0]===0).length,"Más oros");best(prim,"Primera (setenta)");
  P.forEach(p=>{if(g.caps[p.id].includes("0.7")){pt[p.id]++;L.push("Siete de oros: "+p.name)}});
  P.forEach(p=>{if(g.esc[p.id]){pt[p.id]+=g.esc[p.id];L.push("Escobas de "+p.name+": "+g.esc[p.id])}});
  P.forEach(p=>g.score[p.id]+=pt[p.id]);g.rs=L;
  const mx=Math.max(...P.map(p=>g.score[p.id]));
  if(mx>=g.goal&&P.filter(p=>g.score[p.id]===mx).length===1)g.over=P.find(p=>g.score[p.id]===mx).id;else esRound(g)}

/* ================= CHINCHÓN (helpers) ================= */
const sidx=c=>NUMS.indexOf(pc(c)[1]);
const mkDeck=d=>{const o=[];for(let k=0;k<d;k++)for(const c of deck40())o.push(k?c+"."+k:c);return shuffle(o)};
function melds(cs){const out=[],by={},runs={};
  cs.forEach((c,i)=>{const[s,n]=pc(c),k=sidx(c);(by[n]=by[n]||[]).push(i);runs[s]=runs[s]||{};(runs[s][k]=runs[s][k]||[]).push(i)});
  for(const k in by){const a=by[k],m=a.length;if(m>=3)for(let x=1;x<(1<<m);x++){const q=a.filter((_,j)=>x>>j&1);if(q.length>=3)out.push({t:"g",i:q})}}
  for(const s in runs){const r=runs[s];for(let a=0;a<10;a++){let ch=[[]];for(let b=a;b<10&&r[b];b++){ch=ch.flatMap(p=>r[b].map(i=>p.concat(i)));if(b-a>=2)ch.forEach(p=>out.push({t:"r",i:p}))}}}
  return out}
function arr(cs){const M=melds(cs).map(m=>({...m,mask:m.i.reduce((a,i)=>a|1<<i,0)})),val=cs.map(ev);let bv=1e9,bs=[];
  const dead=u=>{let s=0;for(let i=0;i<cs.length;i++)if(!(u>>i&1))s+=val[i];return s};
  const go=(st,u,ch)=>{const d=dead(u);if(d<bv){bv=d;bs=ch.slice()}if(bv===0)return;for(let m=st;m<M.length;m++)if(!(u&M[m].mask)){ch.push(M[m]);go(m+1,u|M[m].mask,ch);ch.pop();if(bv===0)return}};
  go(0,0,[]);const used=bs.reduce((a,m)=>a|m.mask,0);
  return{pts:bv,melds:bs.map(m=>({t:m.t,cs:m.i.map(i=>cs[i])})),dead:cs.filter((_,i)=>!(used>>i&1))}}
const isChin=cs=>{if(cs.length!==7)return false;const s=pc(cs[0])[0];if(!cs.every(c=>pc(c)[0]===s))return false;const k=cs.map(sidx).sort((a,b)=>a-b);return k.every((v,i)=>i===0||v===k[i-1]+1)};
const canAdd=(m,c)=>{const[s,n]=pc(c);if(m.t==="g")return pc(m.cs[0])[1]===n&&m.cs.length<8;
  return pc(m.cs[0])[0]===s&&(sidx(c)===sidx(m.cs[0])-1||sidx(c)===sidx(m.cs[m.cs.length-1])+1)};
const addTo=(m,c)=>{m.cs=m.t==="r"&&sidx(c)<sidx(m.cs[0])?[c,...m.cs]:[...m.cs,c]};
const nextAct=g=>{let i=(g.turn+1)%g.players.length;while(g.out[g.players[i].id])i=(i+1)%g.players.length;g.turn=i};
function newRound(g){const P=g.players;g.deck=mkDeck(g.d);g.hands={};P.filter(p=>!g.out[p.id]).forEach(p=>g.hands[p.id]=g.deck.splice(0,7));g.disc=[g.deck.pop()];g.round++;
  let d=(g.dealer+1)%P.length;while(g.out[P[d].id])d=(d+1)%P.length;g.dealer=d;g.turn=d;nextAct(g);g.phase="draw"}
function resolve(g,cutter,cutCard){
  const P=g.players,act=P.filter(p=>!g.out[p.id]),ci=act.findIndex(p=>p.id===cutter),ord=act.slice(ci).concat(act.slice(0,ci)),avail=[],rows=[];let chin=false,noLay=false;

  <label>Sala <select id="pub"><option value="1">Pública (aparece en la lista)</option><option value="0">Privada (solo con el código)</option></select></label><br>
  <button data-a="create">Crear sala</button><hr><input id="code" placeholder="Código de sala" maxlength="4" style="text-transform:uppercase"> <button data-a="joinc">Entrar con código</button><hr>
  <button class="sec" data-a="list">Buscar salas públicas</button><div id="pubs"></div><p id="err" class="mut"></p></div>`;
  const f=()=>{const n=+$("#n").value,on=$("#m").value==="online";$("#loc").style.display=on?"none":"";$("#onl").style.display=on?"":"none";
    $("#loc").innerHTML=Array.from({length:n},(_,i)=>`<input class="ln" placeholder="Jugador ${i+1}" maxlength="14">`).join("<br>")+`<br><button data-a="startlocal">Empezar</button>`};
  $("#m").onchange=f;$("#n").onchange=f;f()}
function startlocal(){const pl=[...document.querySelectorAll(".ln")].map((e,i)=>({id:"p"+i,name:e.value.trim()||"Jugador "+(i+1)}));
  R={game:R.game,mode:"local",S:GAMES[R.game].init(pl,opts())};UI={};ORD={};animKey=-1;render()}
async function conn(){if(db)return true;
  if(FIREBASE_CONFIG.apiKey==="PEGA_AQUI"){err("Para jugar online falta configurar Firebase en FIREBASE_CONFIG.");return false}
  try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();me=(await firebase.auth().signInAnonymously()).user.uid;return true}catch(e){err("No se pudo conectar con Firebase.");return false}}
const myName=()=>($("#nm1")&&$("#nm1").value.trim())||"Jugador";
async function create(){if(!await conn())return;const code=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.random()*24|0]).join(""),g=R.game;
  try{await db.collection("games").doc(code).set({game:g,opts:opts(),n:+$("#n").value,pub:$("#pub").value==="1",started:false,host:me,players:[{id:me,name:myName()}],S:null,t:Date.now()});R={game:g,mode:"online",code};ORD={};animKey=-1;watch()}catch(e){err("No se pudo crear la sala. Revisá las reglas de Firestore.")}}
async function join(code,name){if(!await conn())return;code=String(code).trim().toUpperCase();const ref=db.collection("games").doc(code);
  try{await db.runTransaction(async tx=>{const s=await tx.get(ref);if(!s.exists||!s.data().game)throw"No existe esa sala";const r=s.data();
    if(!r.players.some(p=>p.id===me)){if(r.started||r.players.length>=r.n)throw"La sala está llena o ya empezó";r.players.push({id:me,name});if(r.players.length===r.n){r.S=GAMES[r.game].init(r.players,r.opts);r.started=true}}tx.set(ref,r)});
    R={mode:"online",code};ORD={};animKey=-1;watch()}catch(e){err(String(e&&e.message||e))}}
async function list(){if(!await conn())return;
  try{const q=await db.collection("games").where("pub","==",true).get(),rows=[];q.forEach(d=>{const r=d.data();if(r.game&&GAMES[r.game]&&!r.started&&r.players.length<r.n)rows.push(`<div class="row"><span>${GAMES[r.game].icon} ${GAMES[r.game].name} · ${esc(r.players[0].name)} · ${r.players.length}/${r.n}</span><button data-a="joinp" data-p='"${d.id}"'>Unirme</button></div>`)});
    $("#pubs").innerHTML=rows.join("")||`<p class="mut">No hay salas públicas abiertas.</p>`}catch(e){err("No se pudo buscar salas.")}}
function watch(){if(R.unsub)R.unsub();R.unsub=db.collection("games").doc(R.code).onSnapshot(s=>{R.room=s.data();if(R.room)R.game=R.room.game;render()})}
function show(S,who){const G=GAMES[R.game];$("#app").innerHTML=`<button class="sec" data-a="home">Salir</button>`+G.view(S,who,UI)+(S.over?`<button data-a="home">Volver al inicio</button>`:"");if(G.fx)G.fx(S,who)}
function render(){if(!R.mode)return;const G=GAMES[R.game];
  if(R.mode==="online"){const r=R.room;if(!r){$("#app").textContent="Conectando…";return}
    if(!r.started){$("#app").innerHTML=`<h2>Sala ${esc(R.code)}</h2><p>${r.pub?"Pública":"Privada"} · ${GAMES[r.game].icon} ${GAMES[r.game].name} · ${r.players.length}/${r.n} jugadores</p><p class="mut">Compartí el código <b>${esc(R.code)}</b>. El juego empieza cuando se completa la sala.</p><div class="pan">${r.players.map(p=>esc(p.name)).join("<br>")}</div><button class="sec" data-a="home">Salir</button>`;return}
    return show(r.S,me)}
  const S=R.S,actor=G.turnOf(S)||S.players[0].id;
  if(!S.over&&actor!==R.prev){R.prev=actor;R.veil=true}
  if(R.veil&&!S.over){$("#app").innerHTML=`<div class="pan win">Turno de ${esc(nm(S,actor))}</div><p>Pasale el dispositivo a <b>${esc(nm(S,actor))}</b>. Los demás, ¡no miren! 👀</p><button data-a="see">Ver mi mano</button><div class="mut">${(S.log||[]).map(esc).join("<br>")}</div>`;return}
  show(S,actor)}
async function dispatch(a,p){const G=GAMES[R.game];
  if(R.mode==="local"){const g=clone(R.S),e=G.act(g,G.turnOf(g),a,p);if(e){toast(e);return render()}R.S=g;UI={};return render()}
  const g=clone(R.room.S),e=G.act(g,me,a,p);if(e){toast(e);return render()}UI={};
  try{await db.collection("games").doc(R.code).update({S:g})}catch(x){toast("Error de conexión")}}
$("#app").onclick=e=>{if(dragged||busy)return;const t=e.target.closest("[data-a]");if(!t||t.disabled)return;const a=t.dataset.a,p=t.dataset.p?JSON.parse(t.dataset.p):null;
  const m={home:goHome,install,pick:k=>{R={game:k};setup()},create,joinc:()=>join($("#code").value,myName()),joinp:c=>join(c,myName()),list,startlocal,see:()=>{R.veil=false;render()}};
  if(m[a])return m[a](p);
  if(a.startsWith("u_")){const r=GAMES[R.game].ui(UI,a,p,R.mode==="online"?R.room.S:R.S,actorId());if(r&&r.go)return go(r.go[0],r.go[1]);return render()}
  go(a,p)};
goHome();
</script></body></html>
